name: Moodle plugin CI

on:
  push:
    branches: [poc1, poc2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A release being added runs without holding the others up; see the matrix.
    continue-on-error: ${{ matrix.experimental }}

    services:
      postgres:
        # Each release's own minimum: 5.3 refuses to install on anything older than
        # PostgreSQL 17, and the releases before it are left on the 16 they pass on.
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Every release the plugin claims to support is built, because version.php
        # says 5.0 to 5.2 and a claim nothing tests is not a claim.
        #
        # 5.1 is not redundant. The AI subsystem changed in 5.1 and not again in
        # 5.2 (response constructors gained an $error argument, failed responses
        # must carry an error name), while core's check API changed in 5.2 and not
        # in 5.1. So 5.1 is the only release that pairs the new AI subsystem with
        # the old check API, and testing 5.0 and 5.2 alone would only cover that
        # combination by accident.
        #
        # 5.3 was released on 2026-10-05 and joins as a non-blocking job first: it is
        # promoted, and version.php's supported range extended, once it has been
        # seen to pass here. The tests already pass against v5.3.0 locally, which
        # is the same commit as MOODLE_503_STABLE on release day.
        include:
          - moodle-branch: MOODLE_500_STABLE
            php: '8.3'
            experimental: false
            postgres: '16'
          - moodle-branch: MOODLE_500_STABLE
            php: '8.4'
            experimental: false
            postgres: '16'
          - moodle-branch: MOODLE_501_STABLE
            php: '8.3'
            experimental: false
            postgres: '16'
          - moodle-branch: MOODLE_501_STABLE
            php: '8.4'
            experimental: false
            postgres: '16'
          - moodle-branch: MOODLE_502_STABLE
            php: '8.3'
            experimental: false
            postgres: '16'
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            experimental: false
            postgres: '16'
          - moodle-branch: MOODLE_503_STABLE
            php: '8.3'
            experimental: true
            postgres: '17'
          - moodle-branch: MOODLE_503_STABLE
            php: '8.4'
            experimental: true
            postgres: '17'

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # The router has to answer actions it did not define, and the only way to find
      # out whether it can store their results on a given release is to have one
      # installed. local_aimedia defines two, and a release once changed what a failed
      # response must carry without anything here noticing, because these tests ran
      # against one Moodle and that plugin was not in this matrix at all.
      - name: Stage the plugin that defines the extra actions
        run: |
          mkdir -p extra
          git clone --depth 1 https://github.com/agent-capy/moodle-aimedia.git aimedia
          cp -r aimedia/local/aimedia extra/aimedia
          cp -r aimedia/lib/editor/tiny/plugins/aimedia extra/tinyaimedia

      - name: Install Moodle
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin/local/airouter \
            --extra-plugins ./extra \
            --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - run: moodle-plugin-ci phplint ./plugin/local/airouter
        if: ${{ always() }}
      - run: moodle-plugin-ci phpmd ./plugin/local/airouter
        if: ${{ always() }}
      - run: ./plugin/.github/run-step.sh phpcs moodle-plugin-ci phpcs --max-warnings 0 ./plugin/local/airouter
        if: ${{ always() }}
      - run: ./plugin/.github/run-step.sh validate moodle-plugin-ci validate ./plugin/local/airouter
        if: ${{ always() }}
      - run: moodle-plugin-ci savepoints ./plugin/local/airouter
        if: ${{ always() }}
      - run: moodle-plugin-ci mustache ./plugin/local/airouter
        if: ${{ always() }}
      # ⚠ No path here. Grunt runs Moodle's own Gruntfile, which works out which
      # component it is linting from the directory it is run in, relative to the
      # Moodle root. Handed the checkout path instead of the installed one it has
      # nothing to work that out from.
      - run: ./plugin/.github/run-step.sh grunt moodle-plugin-ci grunt --max-lint-warnings 0
        if: ${{ always() }}
      # Saying so here is what lets the tests refuse to skip quietly: a run whose
      # extra plugin failed to install would otherwise go green having tested none
      # of what it was added for.
      - run: ./plugin/.github/run-step.sh phpunit moodle-plugin-ci phpunit --fail-on-warning ./plugin/local/airouter
        env:
          MOODLE_AIROUTER_EXTRA_ACTIONS: 1
        if: ${{ always() }}
      - run: ./plugin/.github/run-step.sh behat moodle-plugin-ci behat --profile chrome ./plugin/local/airouter
        if: ${{ always() }}
