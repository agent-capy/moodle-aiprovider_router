name: Moodle plugin CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Every release the plugin claims to support is built, because version.php
        # says 5.0 to 5.2 and a claim nothing tests is not a claim.
        #
        # 5.1 is not redundant. The AI subsystem changed in 5.1 and not again in
        # 5.2 (response constructors gained an $error argument, failed responses
        # must carry an error name), while core's check API changed in 5.2 and not
        # in 5.1. So 5.1 is the only release that pairs the new AI subsystem with
        # the old check API, and testing 5.0 and 5.2 alone would only cover that
        # combination by accident.
        #
        # 5.3 is due in October 2026. It joins this matrix from November 2026
        # as a non-blocking job, and is promoted once it has been verified.
        include:
          - moodle-branch: MOODLE_500_STABLE
            php: '8.3'
          - moodle-branch: MOODLE_500_STABLE
            php: '8.4'
          - moodle-branch: MOODLE_501_STABLE
            php: '8.3'
          - moodle-branch: MOODLE_501_STABLE
            php: '8.4'
          - moodle-branch: MOODLE_502_STABLE
            php: '8.3'
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - run: moodle-plugin-ci phplint
        if: ${{ always() }}
      - run: moodle-plugin-ci phpmd
        if: ${{ always() }}
      - run: ./plugin/.github/run-step.sh phpcs moodle-plugin-ci phpcs --max-warnings 0
        if: ${{ always() }}
      - run: moodle-plugin-ci validate
        if: ${{ always() }}
      - run: moodle-plugin-ci savepoints
        if: ${{ always() }}
      - run: moodle-plugin-ci mustache
        if: ${{ always() }}
      - run: moodle-plugin-ci grunt --max-lint-warnings 0
        if: ${{ always() }}
      - run: ./plugin/.github/run-step.sh phpunit moodle-plugin-ci phpunit --fail-on-warning
        if: ${{ always() }}
      - run: ./plugin/.github/run-step.sh behat moodle-plugin-ci behat --profile chrome
        if: ${{ always() }}
